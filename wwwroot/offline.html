<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clientix</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            text-align: center;
            background: #26313A;
            color: #F4F4E4;
            font-family: "Segoe UI", Tahoma, sans-serif;
            padding: 24px;
        }

        img {
            width: 88px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 8px;
        }

        p {
            color: rgba(244,244,228,.7);
            margin: 0 0 22px;
        }

        button {
            background: #5F8663;
            color: #fff;
            border: 0;
            border-radius: 999px;
            padding: 12px 28px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div>
        <img src="/img/icon-192.png" alt="" />
        <h1>لا يوجد اتصال بالإنترنت · You are offline</h1>
        <p>اتأكد من الشبكة وحاول تاني · Check your connection and try again</p>
        <button onclick="location.reload()">↻</button>
    </div>
</body>
</html>
